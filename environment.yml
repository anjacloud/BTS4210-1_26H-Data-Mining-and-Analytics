# Recipe for the BTS4210 conda environment.
# Rebuild with:  conda env create -f environment.yml
#
# Deliberately unpinned except for Python: no build strings, no platform
# lock-in, so this also solves on Windows. Do not replace this with
# `conda env export` (it pins osx-arm64 builds); use `--from-history` if
# an export is ever needed.
name: bts4210
channels:
  - defaults
dependencies:
  - python=3.13
  - numpy
  - pandas
  - matplotlib
  - scipy
  - scikit-learn
  - seaborn
  - statsmodels
  - spyder
  - jupyterlab
  - openpyxl
  - altair          # LEO's Vega-Altair notebooks, samling 3 (laerer/samling-03/)
  - vega_datasets   # sample data those notebooks import (cars, stocks, barley)
  - pip
  - pip:
      # pip, not conda: conda's tensorflow downgrades pillow/libjpeg and
      # swaps the Qt builds Spyder runs on (dry-run 2026-10-28). Oblig#2.
      - tensorflow==2.21.0
